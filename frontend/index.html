<!DOCTYPE html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student OS</title>
    <link rel="canonical" href="https://studentos.kryvlance.in/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      try {
        const cached = localStorage.getItem('student_os_offline_account_overview');
        if (cached) {
          const parsed = JSON.parse(cached);
          if (parsed && parsed.preferences && parsed.preferences.theme) {
            document.documentElement.dataset.theme = parsed.preferences.theme;
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
